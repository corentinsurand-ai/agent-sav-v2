<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>U'mob — Plateforme SAV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    --lime: #0e5aa7; --lime-hov: #0b4a8c; --lime-soft: #E8F1FB; --lime-bord: #C9DFF5;
    --anthra: #32373C; --anthra2: #4A5158; --ink: #22262B; --mut: #7A8079; --grey: #9D9E9D;
    --bg: #F5F6F3; --card: #fff; --bord: #E7E9E2; --bord2: #D9DCD1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-size: 14px; }

  .proto { background: var(--lime-soft); color: var(--mut); font-size: 11.5px; text-align: center; padding: 4px 10px; border-bottom: 1px solid var(--lime-bord); }

  header.topbar { display: flex; align-items: center; gap: 12px; background: #0e5aa7; color: #fff; padding: 9px 16px; }
  header.topbar .logo { font-size: 18px; font-weight: 800; letter-spacing: .4px; color: #fff; }
  header.topbar .logo span { color: #9fd6ff; font-weight: 600; }
  header.topbar .crumb { font-size: 12px; opacity: .85; }
  header.topbar .spacer { flex: 1; }
  /* ===== C6-AUTH : connexion équipe + overlay ===== */
  #btn-auth.conncte { background:#cfe6fb; color:#0e5aa7; font-weight:700; }
  #auth-overlay { position:fixed; inset:0; background:rgba(16,28,44,.45); z-index:9999; display:flex; align-items:center; justify-content:center; }
  #auth-overlay.cache { display:none; }
  #auth-carte { background:#fff; border-radius:14px; width:360px; max-width:92vw; box-shadow:0 18px 50px rgba(10,20,40,.35); overflow:hidden; }
  #auth-tete { background:linear-gradient(135deg,#0e5aa7,#1c7ed6); color:#fff; padding:16px 20px; }
  #auth-tete h3 { font-size:16px; font-weight:800; }
  #auth-tete p { font-size:12px; opacity:.85; margin-top:3px; }
  #auth-corps { padding:18px 20px; }
  #auth-corps label { display:block; font-size:11px; font-weight:700; color:#5a6472; text-transform:uppercase; letter-spacing:.4px; margin:10px 0 4px; }
  #auth-corps input { width:100%; padding:9px 11px; border:1px solid #d4dae3; border-radius:8px; font-size:14px; color:#22262b; }
  #auth-corps input:focus { outline:none; border-color:#0e5aa7; box-shadow:0 0 0 3px #e2f0fc; }
  .auth-btns { display:flex; gap:8px; margin-top:16px; }
  .auth-btns button { flex:1; padding:10px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer; }
  #auth-ok { background:#0e5aa7; color:#fff; }
  #auth-ok:hover { background:#0b4a8c; }
  #auth-annule { background:#eef1f5; color:#4a5568; }
  #auth-msg { font-size:12px; margin-top:10px; color:#c0392b; min-height:16px; }
  .badge-mode { background: #E8F1FB; color: #0e5aa7; font-weight: 700; font-size: 11px; padding: 4px 10px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit; }
  .badge-mode.ecriture { background: #16a34a; color: #fff; }
  .badge-mode:hover { opacity: .85; }
  .badge-ver { background: rgba(255,255,255,.16); color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); }

  .layout { display: flex; height: calc(100vh - 58px); min-height: 520px; }
  .layout > .volet { position: relative; display: flex; flex-direction: column; min-width: 170px; flex: 0 0 auto; }
  #volet-fil { flex: 1 1 auto; min-width: 300px; }
  /* Largeurs par défaut confortables (redimensionnables et mémorisées) */
  #volet-filtres { flex: 0 0 274px; }
  #volet-liste { flex: 0 0 360px; min-width: 300px; }
  .layout.avec-fiche .layout-fiche { display: flex; }

  /* Barre de titre de chaque volet : glisser-déposer pour réordonner */
  .volet-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--card); border-bottom: 1px solid var(--bord); font-size: 10px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .5px; cursor: grab; user-select: none; }
  .volet-bar:active { cursor: grabbing; }
  .volet-bar .aide { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--grey); font-size: 10px; }
  .volet.deplace { opacity: .5; outline: 2px dashed var(--lime-hov); outline-offset: -3px; }
  .volet.cible { box-shadow: inset 4px 0 0 var(--lime); }
  .volet-corps { flex: 1; overflow-y: auto; }

  /* Poignée de redimensionnement (bord droit de chaque volet) */
  .rz { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; z-index: 6; }
  .rz::after { content: ""; position: absolute; top: 0; right: 3px; width: 2px; height: 100%; background: transparent; }
  .rz:hover::after, .rz.actif::after { background: rgba(174,194,0,.55); }

  aside.filters { background: var(--card); border-right: 1px solid var(--bord); }
  .filters-corps { padding: 14px 12px; }
  aside.filters h3 { font-size: 10.5px; text-transform: uppercase; color: var(--mut); margin: 16px 0 8px; letter-spacing: .6px; }
  aside.filters h3:first-child { margin-top: 0; }
  .chip { display: flex; align-items: center; justify-content: space-between; padding: 6px 9px; border-radius: 8px; cursor: pointer; color: var(--ink); }
  .chip:hover { background: #F0F1EA; }
  .chip.on { background: var(--lime); color: #fff; font-weight: 700; }
  .chip .n { font-size: 11px; color: var(--mut); background: var(--bg); border-radius: 999px; padding: 1px 7px; }
  .chip.on .n { background: rgba(255,255,255,.25); color: #fff; }
  .chip .chip-d { display: flex; align-items: center; gap: 5px; }
  .chip .nl { font-size: 10px; font-weight: 700; color: #fff; background: var(--lime); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .chip .nl:empty { display: none; }
  .chip .wa::before, .mail::before { display: inline-block; width: 14px; text-align: center; margin-right: 6px; }
  .f-sec h3 { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; color: #1a1e23; padding: 7px 2px 6px; border-bottom: 2px solid #7fb6e8; margin-bottom: 8px; }
  .f-sec h3:hover { color: #0e5aa7; }
  .f-sec h3 .fs-f { display: inline-block; width: 12px; text-align: center; color: #0e5aa7; font-size: 9px; }
  .f-sec.reduit .f-sec-chips { display: none; }
  .f-sec.reduit h3 { margin-bottom: 4px; }
  .wa::before { content: "💬"; } .mail::before { content: "✉️"; }

  section.liste { background: var(--card); border-right: 1px solid var(--bord); display: flex; flex-direction: column; }
  .liste-head { padding: 12px 14px; border-bottom: 1px solid var(--bord); display: flex; align-items: center; gap: 8px; }
  .liste-head b { font-size: 13px; }
  .btn { border: 1px solid var(--bord2); background: var(--card); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .btn:hover { background: #F0F1EA; }
  .btn.primaire { background: var(--lime); border-color: var(--lime-hov); color: #fff; font-weight: 700; }
  .btn.primaire:hover { background: var(--lime-hov); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .compteur { margin-left: auto; font-size: 11px; color: var(--mut); }
  .convs { overflow-y: auto; flex: 1; }
  .conv { padding: 11px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .conv + .conv { border-top: 1px solid #EFF0EB; }
  .conv:hover { background: #F3F4EE; }
  .conv.on { background: var(--lime-soft); box-shadow: inset 3px 0 0 var(--lime); }
  .conv .nom { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .heure { grid-column: 2; grid-row: 1; font-size: 11px; color: var(--mut); }
  .conv .extrait { font-size: 12px; color: #5A6169; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; grid-column: 1 / 3; }
  .conv .meta { display: flex; gap: 6px; align-items: center; grid-column: 1 / 3; flex-wrap: wrap; }
  .conv .sousnom { font-size: 10.5px; color: var(--mut); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
  .dot.lu { background: #C9CCC2; }
  .ic { font-size: 11px; }

  .toggle { display: flex; border: 1px solid var(--bord2); border-radius: 8px; overflow: hidden; }
  .toggle button { border: none; background: var(--card); font-size: 11px; padding: 4px 8px; cursor: pointer; color: #5A6169; }
  .toggle button.on { background: var(--lime); color: #fff; font-weight: 600; }
  .grp { margin: 12px 8px 0; padding: 7px 12px; font-size: 12px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: .4px; background: #0e5aa7; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 6px; cursor: pointer; flex-wrap: wrap; }
  .grp:hover { background: #0b4a8c; }
  .grp.on { background: #0b4a8c; }
  .grp .n { font-weight: 700; font-size: 10px; background: rgba(255,255,255,.22); color: #fff; border-radius: 999px; padding: 1px 7px; }
  .grp .tri { display: inline-block; width: 15px; text-align: center; color: #fff; font-size: 10px; cursor: pointer; }
  .grp:hover .tri { color: #fff; }
  .grp .ind { margin-left: auto; color: rgba(255,255,255,.75); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 10px; }
  .grp-bloc { margin: 0 8px; border: 1px solid #C9DFF5; border-top: none; border-radius: 0 0 10px 10px; background: #F7FAFE; overflow: hidden; }
  .grp-bloc .conv { background: transparent; }
  .grp-bloc .conv.on { background: #E8F1FB; }
  .grp-bloc .conv:first-child { border-top: none; }

  .cy { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .cy.nouvelle { background: #e0f2fe; color: #075985; }
  .cy.qualifier { background: #fef3c7; color: #92400e; }
  .cy.praxedo { background: #ede9fe; color: #5b21b6; }
  .cy.encours { background: #dcfce7; color: #166534; }
  .cy.traitee { background: #e2e8f0; color: #475569; }
  .cy.annulee { background: #efe6f7; color: #7c3aed; }
  .cy.attente { background: #ffe4e6; color: #9f1239; }
  .cy.impaye { background: #fee2e2; color: #991b1b; }
  .cy.cliquable { cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .cy.cliquable:hover { outline: 2px solid #0e5aa7; }
  #menu-cycle .cy { margin-right: 6px; }
  /* ===== Boîte outils d'envoi (raccourcis / modèles WA) ===== */
  #boite-outils { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 70; }
  #boite-outils.ouvert { display: block; }
  .bo-fen { max-width: 560px; margin: 70px auto; background: #fff; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.3); overflow: hidden; max-height: calc(100vh - 140px); }
  .bo-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bord); }
  .bo-tabs { display: flex; gap: 6px; flex: 1; }
  .bo-tabs button { border: none; background: #F0F1EA; color: #5A6169; border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .bo-tabs button.on { background: #0e5aa7; color: #fff; }
  .bo-liste { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .bo-item { display: flex; gap: 8px; align-items: center; border: 1px solid var(--bord); border-radius: 10px; padding: 10px 12px; background: #fff; }
  .bo-item:hover { border-color: #0e5aa7; background: #F6FAFE; }
  .bo-txt { flex: 1; font-size: 12.5px; color: #383E43; cursor: pointer; line-height: 1.45; }
  .bo-sp { display: flex; gap: 5px; }
  .bo-nouveau { border-top: 1px dashed var(--bord2); padding-top: 12px; margin-top: 2px; }
  .bo-nouveau .lab { font-size: 11px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .bo-nouveau textarea { width: 100%; height: 60px; border: 1px solid var(--bord2); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; font-family: inherit; resize: vertical; }
  .bo-nouveau textarea:focus { outline: none; border-color: #0e5aa7; box-shadow: 0 0 0 2px rgba(14,90,167,.15); }
  .outils-envoi { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .outil-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--bord2); background: var(--card); border-radius: 99px; padding: 1px 7px 1px 1px; font-size: 10.5px; font-weight: 600; color: var(--ink); cursor: pointer; line-height: 1; transition: border-color .15s, box-shadow .15s; }
  .outil-btn:hover { border-color: #0e5aa7; box-shadow: 0 1px 4px rgba(14,90,167,.15); }
  .ob-ico { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 99px; font-size: 9px; flex: none; }
  .ob-bleu .ob-ico { background: #e2f0fc; }
  .ob-vert .ob-ico { background: #e0f5ec; }
  .ob-orange .ob-ico { background: #fdeedd; }
  .ob-rouge .ob-ico { background: #fbe4e4; }
  #btn-dictee.rec { border-color: #d64545; background: #fdecea; animation: dictee-pulse 1.2s infinite; }
  @keyframes dictee-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,69,69,.35); } 50% { box-shadow: 0 0 0 5px rgba(214,69,69,0); } }
  .pj { margin-top: 6px; background: #EDF2F9; border: 1px solid #C6D2E2; border-radius: 8px; padding: 6px 9px; font-size: 11.5px; color: #3A4450; }
  .canal-envoi { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .canal-envoi .lab { font-size: 11px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .tag { font-size: 10.5px; background: #F0F1EA; color: #4A5148; padding: 2px 7px; border-radius: 999px; }

  section.fil { display: flex; flex-direction: column; background: #F6F7F4; }
  .fil-head { background: var(--card); border-bottom: 1px solid var(--bord); padding: 12px 18px; }
  .fil-head .l1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fil-head .l1 b { font-size: 15px; }
  .fil-head .l2 { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: #5A6169; }
  .messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .bulle { max-width: 68%; padding: 9px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; position: relative; white-space: pre-wrap; word-break: break-word; }
  .bulle .h { font-size: 10.5px; color: var(--mut); margin-bottom: 3px; white-space: nowrap; }
  .bulle .h .h-qui { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; display: inline-block; vertical-align: bottom; }
  /* Objet d'un email, distinct du corps (bulles ✉) — accent bleu de la palette */
  .bulle .mail-obj { font-size: 12px; font-weight: 700; color: #0e5aa7; background: #e2f0fc; border-left: 3px solid #0e5aa7; padding: 4px 8px; border-radius: 6px; margin: 2px 0 6px 0; white-space: pre-wrap; word-break: break-word; }
  .bulle.agent .mail-obj { background: #d7e9fa; }
  /* Historique cité d un email, replié sous le corps */
  .bulle .mail-frame { width: 100%; height: 300px; border: 1px solid #d4e2f2; border-radius: 8px; background: #fff; margin: 2px 0 4px 0; display: block; }
  .bulle.can-mail { max-width: 92%; }  /* v39 : bulles email élargies */
  .bulle.can-mail .mail-frame { max-width: 880px; }
  .bulle .mail-cite { margin-top: 6px; font-size: 12px; }
  /* C8-IMP-2 : libellé d'attribution sous les bulles d'un autre expéditeur */
  .bulle .exp-lib { margin-top: 5px; font-size: 11px; color: #7a8794; font-style: italic; border-top: 1px dashed #dfe6ee; padding-top: 4px; }

  /* ===== C8-ASSIST-2c : assistant IA — design refait (bulle + panneau) ===== */
  .ia-bulle { position: fixed; right: 22px; bottom: 22px; width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer; z-index: 9990; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1273d1 0%, #0e5aa7 55%, #0a3f77 100%); color: #fff;
    box-shadow: 0 10px 28px rgba(14,90,167,.45), 0 2px 8px rgba(10,30,60,.25), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .18s ease, box-shadow .18s ease; }
  .ia-bulle svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 2px rgba(0,20,50,.35)); }
  .ia-bulle::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid rgba(14,90,167,.35); animation: iaPulse 2.6s ease-out infinite; pointer-events: none; }
  .ia-bulle:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 16px 36px rgba(14,90,167,.5), 0 3px 10px rgba(10,30,60,.3), inset 0 1px 0 rgba(255,255,255,.25); }
  @keyframes iaPulse { 0% { transform: scale(.85); opacity: .8; } 70% { transform: scale(1.25); opacity: 0; } 100% { transform: scale(1.25); opacity: 0; } }

  .ia-fen { position: fixed; right: 22px; bottom: 92px; width: 400px; max-width: calc(100vw - 44px); height: 540px; max-height: calc(100vh - 124px); background: #fff; border-radius: 18px; overflow: hidden; z-index: 9991;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(10,25,50,.4), 0 4px 16px rgba(10,25,50,.18), 0 0 0 1px rgba(14,90,167,.08); }
  .ia-fen.cache { display: none; }
  .ia-head { background: linear-gradient(135deg, #1273d1 0%, #0e5aa7 60%, #0a3f77 100%); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .ia-logo { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .ia-logo svg { width: 22px; height: 22px; }
  .ia-head-tit { flex: 1; line-height: 1.25; }
  .ia-head-tit b { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: .2px; }
  .ia-head-st { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #cfe3f8; }
  .ia-head-st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .ia-x { border: none; background: rgba(255,255,255,.16); color: #fff; width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none; transition: background .15s; }
  .ia-x:hover { background: rgba(255,255,255,.3); }

  .ia-corps { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, #f4f8fd 0%, #f7f9fc 100%); }
  .ia-msg { display: flex; gap: 7px; max-width: 92%; }
  .ia-msg .ia-av { width: 26px; height: 26px; border-radius: 50%; flex: none; margin-top: 2px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1273d1, #0a3f77); box-shadow: 0 1px 4px rgba(14,90,167,.4); }
  .ia-msg .ia-av svg { width: 14px; height: 14px; }
  .ia-b { padding: 10px 13px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .ia-ia { align-self: flex-start; }
  .ia-ia .ia-b { background: #fff; border: 1px solid #dfe8f2; border-radius: 4px 14px 14px 14px; box-shadow: 0 1px 3px rgba(10,30,60,.07); }
  .ia-moi { align-self: flex-end; flex-direction: row-reverse; }
  .ia-moi .ia-b { background: linear-gradient(135deg, #1273d1 0%, #0e5aa7 100%); color: #fff; border-radius: 14px 4px 14px 14px; box-shadow: 0 3px 10px rgba(14,90,167,.35); }
  .ia-moi .ia-av { background: #e2e8f0; color: #5b6b7f; font-size: 12px; font-weight: 700; }
  /* indicateur de frappe : 3 points animés */
  .ia-b.ia-ecrit { display: inline-flex; gap: 5px; align-items: center; padding: 13px 15px; }
  .ia-b.ia-ecrit i { width: 7px; height: 7px; border-radius: 50%; background: #9fb8d4; animation: iaPoint 1.2s ease-in-out infinite; }
  .ia-b.ia-ecrit i:nth-child(2) { animation-delay: .18s; }
  .ia-b.ia-ecrit i:nth-child(3) { animation-delay: .36s; }
  @keyframes iaPoint { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

  .ia-barre { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid #e7ebf1; background: #fff; align-items: flex-end; }

  /* C9-NEWCONV : fenêtre « Nouvelle conversation » */
  #nouvconv { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 50; }
  #nouvconv.ouvert { display: block; }
  #nouvconv label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--mut); margin-bottom: 5px; }
  #nouvconv input { width: 100%; border: 1.5px solid var(--bord2); border-radius: 12px; padding: 9px 13px; font-size: 13.5px; font-family: inherit; background: #fff; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
  #nouvconv input:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 3px rgba(14,90,167,.12); }
  body.sombre #nouvconv input { background: #1c2126; color: #e8ebee; border-color: #3f4750; }
  body.sombre #nouvconv input:focus { border-color: #10B981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
  #nouveaux.ouvert { display: block; }
  .nv-fen { max-width: 640px; margin: 26px auto; background: var(--card); border-radius: 16px; height: calc(100vh - 52px); display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.3); overflow: hidden; }
  .nv-corps { flex: 1; overflow-y: auto; padding: 14px 18px 20px; }
  .nv-cycle { display: flex; align-items: center; gap: 8px; padding: 12px 4px 6px; font-size: 12px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .nv-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #EFF0EB; border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: var(--card); }
  .nv-item:hover { border-color: var(--lime-hov); background: var(--lime-soft); }
  .nv-item .nv-bulle { background: var(--lime-soft); color: #44483D; border-radius: 10px; padding: 7px 10px; font-size: 12px; flex: 1; }
  .nv-item .infos { min-width: 0; }
  .nv-item .infos .n { font-weight: 600; font-size: 12.5px; }
  .nv-item .infos .e { font-size: 11px; color: var(--mut); }
  .nv-item .h { font-size: 10.5px; color: var(--mut); white-space: nowrap; }
  .ctx { position: fixed; z-index: 90; background: var(--card); border: 1px solid var(--bord); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); min-width: 190px; display: none; padding: 4px; }
  .ctx.ouvert { display: block; }
  .ctx button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 8px 12px; font-size: 12.5px; cursor: pointer; border-radius: 7px; color: var(--ink); }
  .ctx button:hover { background: var(--lime-soft); }

  /* ===== Sujets : arborescence sur la fiche client + gestion ===== */
  #sujets { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 60; }
  #sujets.ouvert { display: block; }
  .suj-titre { font-weight: 700; font-size: 12px; margin: 9px 0 4px; color: var(--anthra); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .suj-titre .btn { padding: 2px 8px; font-size: 10.5px; }
  .suj-enfant { margin-left: 15px; }
  .suj-conv { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border: 1px solid #EFF0EB; border-radius: 9px; margin: 4px 0; font-size: 12px; flex-wrap: wrap; background: var(--card); }
  .suj-conv .qui { font-weight: 600; }
  .suj-conv .sp { margin-left: auto; display: flex; gap: 5px; }
  .suj-conv.suj-arch { background: #F6F7F3; opacity: .75; }
  #notifs { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 60; }
  #notifs.ouvert { display: block; }
  .bulle-note { align-self: center; max-width: 82%; background: #fffdf0; border: 1px dashed #d6c66a; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: #4a4534; line-height: 1.45; }
  .bulle-note .h { font-size: 10.5px; color: #8a6d1a; margin-bottom: 3px; font-weight: 700; }
  /* ===== Avatars / profils ===== */
  .pav { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11.5px; line-height: 1; vertical-align: -4px; box-shadow: 0 1px 2px rgba(0,0,0,.18); flex: none; }
  .pav.gd { width: 34px; height: 34px; font-size: 18px; vertical-align: middle; }
  .prof-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--bord); border-radius: 10px; margin-bottom: 8px; background: var(--card); }
  .prof-item .prof-nom { font-weight: 700; font-size: 13px; }
  .prof-item .prof-role { font-size: 11px; color: var(--mut); }
  .prof-item .btn { padding: 3px 9px; font-size: 11px; }
  .prof-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .prof-pick button { width: 34px; height: 34px; font-size: 18px; border: 1px solid var(--bord); border-radius: 50%; background: var(--card); cursor: pointer; }
  .prof-pick button:hover { background: var(--lime-soft); border-color: var(--lime-hov); }
  #rattache { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 60; }
  #rattache.ouvert { display: block; }
  #profils { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 60; }
  #profils.ouvert { display: block; }
  /* ===== C6.3 : panneau admin des comptes équipe ===== */
  #comptes { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 60; }
  #comptes.ouvert { display: block; }
  /* ===== C16-KPI : console de contrôle (v76 — design) ===== */
  #kpi { display: none; position: fixed; inset: 0; background: rgba(34,38,43,.5); z-index: 60; }
  #kpi.ouvert { display: block; }
  .kpi-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi-carte { position: relative; background: linear-gradient(180deg, #f8fbff, #fff); border: 1px solid #d7e7f6; border-radius: 14px; padding: 12px 13px 11px; overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
  .kpi-carte:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(14,90,167,.16); }
  .kpi-carte::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #1c7ed6, #0e5aa7); }
  .kpi-carte b { font-size: 23px; color: #0e5aa7; display: block; line-height: 1.15; letter-spacing: -.5px; }
  .kpi-carte span { font-size: 10.5px; color: #7d8794; }
  .kpi-carte.hero { background: linear-gradient(135deg, #0e5aa7, #1c7ed6); border: none; }
  .kpi-carte.hero::before { background: linear-gradient(90deg, #6ec0ff, #bde0ff); height: 5px; }
  .kpi-carte.hero b { color: #fff; }
  .kpi-carte.hero span { color: #cfe2f7; }
  .kpi-sec { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: #1a1e23; margin: 16px 0 8px; border-bottom: 2px solid #7fb6e8; padding-bottom: 4px; display: flex; align-items: center; gap: 7px; }
  .kpi-ligne { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 5px 0; }
  .kpi-ligne .lab { flex: 0 0 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi-ligne .n { flex: 0 0 34px; text-align: right; font-weight: 700; color: #0e5aa7; }
  .kpi-barre { flex: 1; height: 9px; border-radius: 99px; background: #eef4fb; overflow: hidden; }
  .kpi-barre i { display: block; height: 100%; background: linear-gradient(90deg, #1c7ed6, #0e5aa7); border-radius: 99px; }
  .kpi-barre.verte { background: #e9f7ef; }
  .kpi-barre.verte i { background: linear-gradient(90deg, #37b97c, #1d7a4f); }
  /* donut canaux + graphique activité */
  .kpi-duo { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .kpi-boite { flex: 1; min-width: 220px; background: linear-gradient(180deg, #f8fbff, #fff); border: 1px solid #d7e7f6; border-radius: 14px; padding: 12px 14px; }
  .kpi-donut { width: 118px; height: 118px; border-radius: 50%; margin: 6px auto 0; position: relative; }
  .kpi-donut::after { content: ""; position: absolute; inset: 15px; background: #fff; border-radius: 50%; }
  .kpi-donut b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 21px; color: #0e5aa7; z-index: 1; }
  .kpi-legende { display: flex; gap: 16px; justify-content: center; font-size: 11.5px; color: #3a4250; margin-top: 10px; flex-wrap: wrap; }
  .kpi-legende i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .kpi-graphe { display: flex; align-items: flex-end; gap: 7px; height: 108px; padding: 4px 2px 0; }
  .kpi-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .kpi-cols { display: flex; align-items: flex-end; gap: 3px; width: 100%; height: 82px; }
  .kpi-colbar { flex: 1; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #1c7ed6, #0e5aa7); min-height: 3px; }
  .kpi-colbar.verte { background: linear-gradient(180deg, #37b97c, #1d7a4f); }
  .kpi-jour { font-size: 9.5px; color: #8a93a3; margin-top: 5px; }
  body.sombre .kpi-carte { background: #242a31; border-color: #3a4149; }
  body.sombre .kpi-carte.hero { background: linear-gradient(135deg, #0c4b8c, #1769b8); }
  body.sombre .kpi-boite { background: #242a31; border-color: #3a4149; }
  body.sombre .kpi-donut::after { background: #242a31; }
  body.sombre .kpi-barre { background: #313941; }
  body.sombre .kpi-barre.verte { background: #2d3a33; }
  body.sombre .kpi-sec { color: #d7dce2; }
  .cpt-ligne { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--bord); border-radius: 9px; margin-bottom: 7px; background: #fff; }
  .cpt-ligne.off { opacity: .55; }
  .cpt-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; flex: none; }
  .cpt-infos { flex: 1; min-width: 0; }
  .cpt-infos .n { font-weight: 700; font-size: 13px; color: var(--ink); }
  .cpt-infos .e { font-size: 11px; color: var(--mut); }
  .cpt-btn { border: none; border-radius: 7px; padding: 5px 9px; font-size: 11px; font-weight: 700; cursor: pointer; flex: none; }
  .cpt-btn.actif { background: #eef1f5; color: #4a5568; }
  .cpt-btn.actif:hover { background: #e2e6ec; }
  .cpt-btn.desact { background: #fdecea; color: #b91c1c; }
  .cpt-btn.desact:hover { background: #f9dcda; }
  .cpt-badge { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 8px; flex: none; }
  .cpt-badge.admin { background: #e2f0fc; color: #0e5aa7; }
  .cpt-badge.collab { background: #f0f1ea; color: #5a626b; }
  .cpt-form { border: 1px dashed var(--bord2); border-radius: 10px; padding: 12px; margin-top: 12px; background: #fbfcfa; }
  .cpt-form h4 { font-size: 12px; color: var(--anthra); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px; }
  .cpt-form .lignes2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cpt-form input, .cpt-form select { width: 100%; padding: 7px 9px; border: 1px solid #d4dae3; border-radius: 7px; font-size: 13px; color: var(--ink); background: #fff; margin-top: 4px; }
  .cpt-form label { font-size: 10px; font-weight: 700; color: #5a6472; text-transform: uppercase; letter-spacing: .3px; }
  #cpt-msg { font-size: 12px; margin-top: 8px; color: #b91c1c; min-height: 15px; }
  .suj-conv .btn { white-space: nowrap; }

  /* ============================================================
     C8-DESIGN-1 : REFONTE VISUELLE GLOBALE — couche de surcharge
     Palette moderne bleu ardoise, dégradés, ombres douces, micro-
     transitions. Aucune logique touchée : uniquement du CSS, placé
     en dernier pour la cascade.
     ============================================================ */
  :root {
    --lime: #0e5aa7; --lime-hov: #0b4a8c; --lime-soft: #E8F1FB; --lime-bord: #C9DFF5;
    --anthra: #2b3442; --anthra2: #45526a; --ink: #1a2433; --mut: #64748b; --grey: #94a3b8;
    --bg: #EDF2F8; --card: #ffffff; --bord: #E2E9F1; --bord2: #D3DDE9;
    --grad-bleu: linear-gradient(135deg, #1273d1 0%, #0e5aa7 55%, #0a3f77 100%);
    --ombre: 0 1px 3px rgba(15,35,70,.06), 0 4px 14px rgba(15,35,70,.06);
    --ombre-lg: 0 12px 40px rgba(15,35,70,.16), 0 2px 8px rgba(15,35,70,.08);
  }
  * { scrollbar-width: thin; scrollbar-color: #c3d2e4 transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #c3d2e4; border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #9fb8d4; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: #cfe3f8; }
  input, textarea, select, button { font-family: inherit; }
  body { background: var(--bg); }

  /* --- bandeau prototype --- */
  .proto { background: #1a2433; color: #8fa3bd; border-bottom: none; letter-spacing: .2px; padding: 5px 12px; }

  /* --- topbar : dégradé bleu, ombre, boutons translucides --- */
  header.topbar { background: var(--grad-bleu); padding: 9px 18px; box-shadow: 0 2px 10px rgba(10,40,80,.25), inset 0 1px 0 rgba(255,255,255,.15); }
  header.topbar .logo { font-size: 17px; letter-spacing: .3px; }
  header.topbar .crumb { background: rgba(255,255,255,.14); padding: 4px 12px; border-radius: 999px; font-size: 11.5px; opacity: 1; }
  .btn-nouv { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.22); transition: background .15s, transform .15s; }
  .btn-nouv:hover { background: rgba(255,255,255,.26); transform: translateY(-1px); }
  .badge-ver { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); }
  #btn-auth.conncte { background: #cfe6fb; color: #0e5aa7; }

  /* --- volets : barres de titre claires, poignée bleue --- */
  .volet-bar { background: linear-gradient(180deg, #fbfdff, #f4f7fb); color: var(--mut); border-bottom: 1px solid var(--bord); padding: 8px 14px; }
  .rz:hover::after, .rz.actif::after { background: rgba(14,90,167,.5); }
  .volet.deplace { outline-color: var(--lime-hov); }

  /* --- filtres : chips arrondies + dégradé actif --- */
  aside.filters { background: var(--card); border-right: 1px solid var(--bord); }
  .chip { border-radius: 10px; padding: 7px 10px; transition: background .13s, color .13s, box-shadow .13s; }
  .chip:hover { background: #EEF4FB; }
  .chip.on { background: var(--grad-bleu); box-shadow: 0 2px 8px rgba(14,90,167,.35); }
  .chip .n { background: #EDF2F8; }
  .f-sec h3 { color: #3a4a60; border-bottom: 2px solid #b9d3ee; }
  .toggle button.on { background: var(--lime); }

  /* --- boutons --- */
  .btn { border: 1px solid var(--bord2); border-radius: 10px; background: #fff; padding: 6px 12px; box-shadow: 0 1px 2px rgba(15,35,70,.05); transition: background .15s, border-color .15s, box-shadow .15s; }
  .btn:hover { background: #EEF4FB; border-color: #b9d3ee; }
  .btn.primaire { background: var(--grad-bleu); border: none; box-shadow: 0 2px 8px rgba(14,90,167,.35); }
  .btn.primaire:hover { background: var(--grad-bleu); filter: brightness(1.1); color: #fff; }

  /* --- liste des conversations --- */
  section.liste { background: var(--card); border-right: 1px solid var(--bord); }
  .liste-head { padding: 13px 15px; border-bottom: 1px solid var(--bord); }
  .conv { padding: 11px 15px; transition: background .13s; }
  .conv + .conv { border-top: 1px solid #F0F4F9; }
  .conv:hover { background: #F1F6FC; }
  .conv.on { background: #E8F1FB; box-shadow: inset 3px 0 0 var(--lime); }
  .conv.on:hover { background: #DDEBF9; }
  .dot { background: #0e5aa7; box-shadow: 0 0 0 2px rgba(14,90,167,.18); }
  .dot.lu { background: #cbd5e1; box-shadow: none; }

  /* --- bandes enseignes (vue Par entreprise) --- */
  .grp { background: var(--grad-bleu); border-radius: 10px 10px 0 0; margin: 14px 8px 0; padding: 8px 13px; box-shadow: 0 2px 6px rgba(14,90,167,.25); }
  .grp:hover, .grp.on { background: linear-gradient(135deg, #0b4a8c, #0a3f77); }
  .grp-bloc { border-color: #C9DFF5; background: #F5F9FE; border-radius: 0 0 12px 12px; }

  /* --- badges cycles : coins pleins + liseré discret --- */
  .cy { border-radius: 999px; padding: 2.5px 9px; }
  .cy.cliquable:hover { outline-color: #1273d1; }

  /* --- le fil : fond clair, bulles modernes asymétriques --- */
  section.fil { background: linear-gradient(180deg, #F0F5FA, #F4F7FA); }
  .fil-head { border-bottom: 1px solid var(--bord); }
  .messages { gap: 12px; padding: 18px 20px; }
  .bulle { border-radius: 14px; box-shadow: 0 1px 3px rgba(15,35,70,.07); }
  .entrant { background: #fff; border: 1px solid #E2E9F1; border-top-left-radius: 4px; }
  .entrant .h { color: #64748b; }
  .agent { background: linear-gradient(135deg, #E4F0FC, #D7E8FA); border: 1px solid #BCD9F2; border-top-right-radius: 4px; }
  .agent .h { color: #0b5394; }
  .collab { background: #E4F6F0; border: 1px solid #BFE3D4; border-top-right-radius: 4px; }
  .bulle .mail-obj { background: #e8f2fd; }
  .bulle.agent .mail-obj { background: #d9eaf9; }
  .pj { background: #EEF4FB; border: 1px solid #D5E3F2; }

  /* --- commentaires internes : jaune crème adouci --- */
  .commentaires { background: #FFFBEA; border-top: 1px solid #F0E6C0; }
  .bulle-note { background: #fffdf0; border: 1px dashed #d6c66a; }

  /* --- barre de saisie : blanc + anneau bleu --- */
  .saisie { background: var(--card); border-top: 1px solid var(--bord); }
  .saisie .barre { background: #fff; border: 1.5px solid var(--bord2); border-radius: 18px; box-shadow: 0 1px 4px rgba(15,35,70,.05); }
  .saisie .barre:focus-within { border-color: #0e5aa7; box-shadow: 0 0 0 3px rgba(14,90,167,.12); }
  #btn-dictee { background: #EDF2F8; border-radius: 12px; }
  #btn-dictee:hover { background: #E1E9F2; }
  .comm-saisie input:focus { border-color: #0e5aa7; box-shadow: 0 0 0 3px rgba(14,90,167,.12); }
  .rech-fil input:focus { border-color: #0e5aa7; box-shadow: 0 0 0 3px rgba(14,90,167,.12); }
  .rech-fil input, .rech-conv { border-color: var(--bord2); }

  /* --- fiche société --- */
  #panneau-fiche { background: var(--card); border-left: 1px solid var(--bord); }
  #fiche .fiche-entete { border-radius: 14px; border-color: var(--bord); box-shadow: var(--ombre); }
  #fiche .fiche-sec { border-radius: 14px; border-color: var(--bord); box-shadow: 0 1px 3px rgba(15,35,70,.04); }
  .bloc { border-radius: 14px; border-color: var(--bord); }
  .ligne-ctc { border-color: #EDF2F8; border-radius: 12px; }
  .scoot { background: #EEF4FB; }
  .cp-contact:hover { border-color: #7fb6e8; background: #EEF4FB; }
  .scoot-ligne { border-color: #EDF2F8; border-radius: 12px; }

  /* --- fenêtres modales : flou, coins larges, têtes dégradées --- */
  #boite-outils, #carnet, #nouveaux, #sujets, #notifs, #profils, #rattache, #comptes, #kpi, #auth-overlay { background: rgba(15,23,42,.55); backdrop-filter: blur(2px); }
  .bo-fen, .carnet-fen, .nv-fen { border-radius: 18px; box-shadow: 0 30px 80px rgba(10,25,50,.35); }
  .carnet-head { background: var(--grad-bleu); box-shadow: 0 2px 10px rgba(10,40,80,.25); }
  .carnet-liste { background: #FAFCFE; }
  .cl-ctc:hover { background: #EEF4FB; }
  .cl-ctc.on { background: #E8F1FB; }
  .bo-item { border-color: var(--bord); border-radius: 12px; }
  .bo-item:hover { border-color: #0e5aa7; background: #F4F9FE; }
  .bo-tabs button { background: #EEF2F7; color: #5a6a80; }
  .nv-item { border-color: #EDF2F8; border-radius: 12px; }
  .nv-item:hover { border-color: #0e5aa7; background: #EEF4FB; }
  .ctx { border: 1px solid var(--bord); border-radius: 12px; box-shadow: 0 12px 32px rgba(10,25,50,.2); }
  .ctx button { border-radius: 8px; }
  .cp-tete { background: linear-gradient(135deg, #1e293b, #0f1a2b); }
  .cp-tete .avatar { border-color: #1273d1; }
  .cp-section { border-radius: 14px; box-shadow: var(--ombre); }
  .cp-btn.envoyer { background: var(--grad-bleu); box-shadow: 0 2px 8px rgba(14,90,167,.3); }
  .cp-btn.envoyer:hover { background: linear-gradient(135deg, #0b4a8c, #0a3f77); color: #fff; }
  #auth-carte { border-radius: 18px; box-shadow: 0 30px 80px rgba(10,25,50,.35); }

/* clés chronologiques : messages (jour JOUR + hh:mm) et commentaires ("jj/mm hh:mm") */
function cleMsg(convId, msg) {
  /* BUGFIX TRI CHRONOLOGIQUE (C7-TRI-1) : les vrais messages (C4/C5) portent
     un timestamp ISO (msg.ts) — c'est LUI qu'il faut trier, jamais le libellé
     affiché "jj/mm hh:mm" : parseInt("30/10 1123") = 30 et parseInt("02/11
     0926") = 2 → les WhatsApp du 30/10 passaient APRÈS les emails du 02/11. */
  var d = (msg && msg.ts) ? new Date(msg.ts) : null;
  if (d && !isNaN(d)) return d.getTime();
  return msLibelle(convId, (msg && msg.t) || "", 0);
}
/* Estime une date (ms) depuis un libellé "hh:mm" (démo : décalage JOUR en
   jours) ou "jj/mm hh:mm" (commentaires internes). */
function msLibelle(convId, t, joursDefaut) {
  var p = (t || "").split(" ");
  var hm = 0, jours = (convId !== undefined && JOUR[convId] !== undefined) ? JOUR[convId] : (joursDefaut || 0);
  if (p.length >= 2) {
    hm = parseInt(p[1].replace(":", ""), 10) || 0;
    var dd = p[0].split("/");
    if (dd.length === 2) {
      var now = new Date();
      var past = new Date(now.getFullYear(), parseInt(dd[1], 10) - 1, parseInt(dd[0], 10));
      if (past > now) past = new Date(now.getFullYear() - 1, parseInt(dd[1], 10) - 1, parseInt(dd[0], 10));
      jours = Math.max(0, Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - past) / 86400000));
    }
  } else {
    hm = parseInt((p[0] || "").replace(":", ""), 10) || 0;
  }
  var now2 = new Date();
  return new Date(now2.getFullYear(), now2.getMonth(), now2.getDate() - jours, Math.floor(hm / 100), hm % 100).getTime();
}
function cleComm(t) {
  return msLibelle(undefined, t, 0);
}

var MENTIONS_FILTRE = [];
function suggMentions() {
  var inp = document.getElementById("nv-comm"); var s = document.getElementById("mentions-sugg");
  if (!inp || !s) return;
  var pos = inp.selectionStart || 0;
  var m = inp.value.slice(0, pos).match(/@([A-Za-zÀ-ÿ0-9_]*)$/);
  if (!m) { fermerSugg(); return; }
  var q = m[1].toLowerCase();

  s.innerHTML = MENTIONS_FILTRE.map(function(p, i){

    return '<div class="mention-item' + (i === 0 ? " on" : "") + '" onmousedown="accepterMention(' + i + ');return false;">'
      + '<span class="mention-ic" style="background:' + (pr.col || "#0e5aa7") + '">' + (pr.ic || "👤") + '</span>@' + escTxt(p) + '</div>';
  }).join("");
  s.dataset.sel = "0";
  s.style.display = "block";
}
function fermerSugg() {
  var s = document.getElementById("mentions-sugg");
  if (s) { s.style.display = "none"; s.innerHTML = ""; }
  MENTIONS_FILTRE = [];
}
function accepterMention(i) {
  var inp = document.getElementById("nv-comm"); var p = MENTIONS_FILTRE[i];
  if (!inp || !p) return;
  var pos = inp.selectionStart || 0;
  var avant = inp.value.slice(0, pos).replace(/@([A-Za-zÀ-ÿ0-9_]*)$/, "@" + p + " ");
  inp.value = avant + inp.value.slice(pos);
  inp.selectionStart = inp.selectionEnd = avant.length;
  fermerSugg(); inp.focus();
}
function commKey(e) {
  var s = document.getElementById("mentions-sugg");
  var ouvert = s && s.style.display === "block" && MENTIONS_FILTRE.length;
  if (ouvert && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    var cur = +(s.dataset.sel || 0);
    cur = e.key === "ArrowDown" ? Math.min(cur + 1, MENTIONS_FILTRE.length - 1) : Math.max(cur - 1, 0);
    s.dataset.sel = String(cur);
    Array.prototype.forEach.call(s.children, function(el, i){ el.classList.toggle("on", i === cur); });
    return false;
  }
  if (ouvert && (e.key === "Enter" || e.key === "Tab")) { e.preventDefault(); accepterMention(+(s.dataset.sel || 0)); return false; }
  if (e.key === "Escape") { fermerSugg(); return false; }
  if (e.key === "Enter") { ajouterComm(); return false; }
  return true;
}

/* ===== Dictée vocale pour les commentaires internes ===== */
function dicterComm() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("🎤 La dictée vocale n'est pas disponible dans cet affichage (navigateur ou sandbox). Tu peux saisir le commentaire au clavier."); return; }
  var inp = document.getElementById("nv-comm");
  try {
    var rec = new SR();
    rec.lang = "fr-FR";
    rec.interimResults = false;
    rec.onresult = function(ev){ if (ev.results && ev.results[0]) { inp.value = (inp.value ? inp.value + " " : "") + ev.results[0][0].transcript; inp.focus(); } };
    rec.onerror = function(ev){ alert("🎤 Dictée impossible (" + ev.error + ") — le micro est peut-être bloqué dans l'affichage canvas. En production (Vercel + HTTPS), la dictée fonctionnera."); };
    rec.start();
  } catch (err) {
    alert("🎤 Dictée indisponible ici — elle marchera en production sur le site déployé.");
  }
}

var RECH_TXT = "";
var RECH_FIL = "";

/* Recherche universelle : insensible à la casse, et pour les téléphones
   insensible aux espaces, points et tirets (on compare les chiffres seuls). */
function normTel(s) { return (s || "").replace(/\D/g, ""); }
function correspondTxt(valeurs, q) {
  var ql = (q || "").toLowerCase().trim();
  if (!ql) return true;
  var blob = (valeurs.join ? valeurs.join(" ") : "" + valeurs).toLowerCase();
  if (blob.indexOf(ql) >= 0) return true;
  var qt = normTel(ql);
  if (qt.length >= 2 && normTel(blob).indexOf(qt) >= 0) return true;
  return false;
}
/* Surlignage de toutes les occurrences (sous-chaîne) */
function surligner(txt, q) {
  if (!q) return txt;
  var i = txt.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return txt;
  return txt.slice(0, i) + "<mark>" + txt.slice(i, i + q.length) + "</mark>" + surligner(txt.slice(i + q.length), q);
}

var SELSENT = null;
var VUE = "contact";   /* v110: vue par défaut = liste plate triée par date du dernier message */
var GRP_OUVERTS = {}; /* état ▸/▾ par entreprise (triangle dans la liste) */
var FICHE = false;

function filtre(type, val, el) {
  FX[type] = val;
  /* C22-FILTRE-4 : cliquer sur un CYCLE dans le menu en haut enlève
     automatiquement le filtre d'assignation → on voit toutes les conversations
     du cycle, assignées ou non. */
  if (type === "cycle") {
    FX.ass = "tous";
    document.querySelectorAll("[data-fa]").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-fa") === "tous"); });
  }
  var attr = (type === "canal") ? "data-fc" : (type === "cycle") ? "data-fx" : "data-fa";
  document.querySelectorAll("["+attr+"]").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on");
  MESCY_ON = null;
  saverFx();   /* v117: filtres persistés au rechargement */
  renduMesCycles();
  renduListe();
}
/* v117 : état des filtres + recherche persisté (localStorage) et restauré
   au chargement → F5 = on retrouve exactement la liste telle qu'elle était. */
function saverFx() { try { localStorage.setItem("umob_fx", JSON.stringify(FX)); } catch (e) {} }
function saverRech() { try { localStorage.setItem("umob_rech", RECH_TXT || ""); } catch (e) {} }
function restaurerFiltres() {
  try {
    var fx = JSON.parse(localStorage.getItem("umob_fx") || "null");
    if (fx && typeof fx === "object") {
      FX.canal = fx.canal || "tous"; FX.cycle = fx.cycle || "tous"; FX.ass = fx.ass || "tous";
      document.querySelectorAll("[data-fc]").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-fc") === FX.canal); });
      document.querySelectorAll("[data-fx]").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-fx") === FX.cycle); });
      document.querySelectorAll("[data-fa]").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-fa") === FX.ass); });
    }
    var r = localStorage.getItem("umob_rech") || "";
    if (r) { RECH_TXT = r; var inp = document.getElementById("rech-conv"); if (inp) inp.value = r; }
  } catch (e) {}
}

/* ===== « Mes conversations par cycle » : uniquement les convs assignées à MOI ===== */
var CYCLES_LISTE = ["tous","Nouvelle Demande","A qualifier","A créer dans Praxedo","En cours de réalisation","Attente client","Attente interne","Traitée","Annulée sans réponse","Annulée par le client","DE Commerciales","Bloquée Impayé","Attente Paiement ou pré-auto CB"];
var MESCY_ON = null;
var CLASSE_CYCLE = {
  "Nouvelle Demande": "nouvelle", "A qualifier": "qualifier", "A créer dans Praxedo": "praxedo",
  "En cours de réalisation": "encours", "Traitée": "traitee", "Attente client": "attente",
  "Attente interne": "attente",
  "Annulée sans réponse": "annulee", "Annulée par le client": "annulee",
  "DE Commerciales": "qualifier", "Bloquée Impayé": "impaye", "Attente Paiement ou pré-auto CB": "attente"
};
function classeCycle(cy) { return CLASSE_CYCLE[cy] || null; }
function renduMesCycles() {
  var box = document.getElementById("mes-cycles-chips");
  if (!box) return;
  var qui = document.getElementById("mescycles-qui");
  if (qui) qui.textContent = MOI;
  var mes = CONVS.filter(function(c){ return !c.archive && !RATTACHE[c.id] && c.assigne === MOI; });
  box.innerHTML = CYCLES_LISTE.map(function(cy){
    /* volet 🗂 = MES conversations par cycle (« tous » = toutes mes convs) */
    var n = (cy === "tous") ? mes.length : mes.filter(function(c){ return c.cycle === cy; }).length;
    if (cy !== "tous" && n === 0) return "";
    var lbl = (cy === "tous") ? "Tous mes dossiers" : cy;
    var cl = classeCycle(cy);
    return '<div class="chip' + (MESCY_ON === cy ? " on" : "") + '" onclick="filtreMesCycle(\'' + cy + '\')">' +
      (cl ? '<span class="cy ' + cl + '">' + lbl + '</span>' : lbl) + ' <span class="n">' + n + '</span></div>';
  }).join("");
}
function filtreMesCycle(cy) {
  MESCY_ON = cy;
  /* C22-FILTRE-4 : le volet 🗂 « Mes conversations par cycle » filtre bien sur
     MOI (y compris « tous » = toutes MES conversations). C'est le menu cycles
     EN HAUT (filtre()) qui, lui, enlève le filtre d'assignation. */
  FX.ass = "moi";
  FX.cycle = cy;
  /* C22-FILTRE : on allume AUSSI les pastilles du volet filtres qui
     correspondent à l'état réel (canal tous, cycle choisi, assignation) →
     le filtre actif reste visible, plus de conversations qui « disparaissent ». */
  document.querySelectorAll("[data-fc]").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-fc") === "tous"); });
  document.querySelectorAll("[data-fx]").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-fx") === FX.cycle); });
  document.querySelectorAll("[data-fa]").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-fa") === FX.ass); });
  renduMesCycles();
  renduListe();
}

function basculeVue(v) {
  VUE = v;
  try { localStorage.setItem("umob_vue", v); } catch (e) {}   /* v116: vue persistée */
  document.getElementById("tg-ent").classList.toggle("on", v === "entreprise");
  document.getElementById("tg-ctc").classList.toggle("on", v === "contact");
  renduListe();
}


function visible(c){
  /* C21-RECH : quand une recherche est active, elle est GLOBALE — on ignore
     les exclusions habituelles (archivée 📦, rattachée 📎, filtres assignation/
     canal/cycle) pour ne manquer aucune conversation ; les badges dans la ligne
     signalent leur statut. Sans recherche, comportement habituel. */
  if (!RECH_TXT) {
    if (c.archive || RATTACHE[c.id]) return false;
    if (FX.ass === "moi" && c.assigne !== MOI) return false;
    if (FX.ass === "aucun" && c.assigne) return false;
    if ((FX.canal !== "tous" && c.canal !== FX.canal) || (FX.cycle !== "tous" && c.cycle !== FX.cycle)) return false;
    return true;
  }
  return correspondTxt([c.nom, c.entreprise, c.extrait, c.contact.tel, c.contact.plaque, c.cycle,
    c.fil.map(function(m){ return m.txt; }).join(" "),
    c.comms.map(function(m){ return m.txt; }).join(" ")], RECH_TXT);
}

/* Statut d'un message sortant (✓ envoyé, ✓✓ distribué gris, ✓✓ lu bleu — comme WhatsApp) */
function statutDe(msg, fil) {
  if (msg.qui === "client") return null;                       /* reçu du client : pas de coche */
  if (msg.st) return msg.st;                                   /* statut explicite (C2 réel → wa_statuts) */
  var outs = fil.filter(function(m){ return m.qui !== "client"; });
  return outs[outs.length - 1] === msg ? "distribue" : "lu";    /* démo : dernier envoyé = distribué, autres = lus */
}
function cocheHtml(st) {
  if (!st) return "";
  var LIB = { envoye: "Envoyé ✓", distribue: "Distribué ✓✓", lu: "Lu ✓✓" };
  var col = st === "lu" ? "#53bdeb" : "#9aa4b1";
  return '<span style="color:' + col + ';font-weight:700;font-size:10px;letter-spacing:-1.5px;margin-left:5px;white-space:nowrap;display:inline-block;vertical-align:0;" title="' + LIB[st] + '">' + (st === "envoye" ? "✓" : "✓✓") + '</span>';
}
/* ===== v38 : compteurs des volets Canaux/Cycles/Assignation recalculés =====
   Les chiffres de la démo étaient figés dans le HTML (16, 2, 3…) : ils sont
   désormais recomptés sur les conversations réelles à chaque rendu. */
function majCompteursFiltres() {
  var actives = CONVS.filter(function(c){ return !c.archive && !RATTACHE[c.id]; });
  function majSel(attr, compte) {
    document.querySelectorAll(".chip[" + attr + "]").forEach(function(ch){
      var n = ch.querySelector(".n");
      if (n) n.textContent = String(compte(ch.getAttribute(attr)));
    });
  }
  majSel("data-fc", function(v){
    return v === "tous" ? actives.length
      : actives.filter(function(c){ return c.canal === v; }).length;
  });
  majSel("data-fx", function(v){
    return v === "tous" ? actives.length
      : actives.filter(function(c){ return c.cycle === v; }).length;
  });
  majSel("data-fa", function(v){
    if (v === "tous") return actives.length;
    if (v === "moi") return actives.filter(function(c){ return c.assigne === MOI; }).length;
    return actives.filter(function(c){ return !c.assigne; }).length;
  });
}
/* C8-TRI-1 : timestamp du dernier message d'une conversation (fallback 0
   pour les convs démo sans ts). Le fil est déjà trié chronologiquement. */
function dernierTs(c) {
  var f = c.fil || [];
  for (var i = f.length - 1; i >= 0; i--) {
    var t = Date.parse(f[i] && (f[i].ts || f[i].T) || "");
    if (!isNaN(t)) return t;
  }
  return c.tsCreation || 0;
}
/* C10-TRI : heure du dernier message affichée à côté de chaque conversation
   — calculée directement depuis le timestamp réel (WA et Email),
   format « HH:MM » si aujourd'hui, « hier HH:MM », sinon « JJ/MM HH:MM ». */
function heureDernierMsg(c) {
  var t = dernierTs(c);
  if (!t) return c.heure || "";
  var d = new Date(t), now = new Date();
  var hm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  if (d.toDateString() === now.toDateString()) return hm;
  if (new Date(now.getTime() - 86400000).toDateString() === d.toDateString()) return "hier " + hm;
  return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + " " + hm;
}
function renduListe() {
  majCompteursFiltres();
  var el = document.getElementById("convs"); el.innerHTML = "";
  /* C10-TRI : tri STRICTEMENT chronologique — la conversation dont le dernier
     message (WA ou Email) est le plus récent est en haut, lues ou non
     (le badge 💬 signale les non-lues). Vue entreprise : les enseignes suivent
     l'activité de leur conversation la plus récente. */
  var liste = CONVS.filter(visible).sort(function(a, b) {
    return dernierTs(b) - dernierTs(a);
  });
  var n = liste.length;
  /* C21-RECH : compteur de résultats affiché quand une recherche est active */
  var rn = document.getElementById("rech-nb");
  if (rn) rn.textContent = RECH_TXT ? (n + " résultat" + (n > 1 ? "s" : "")) : "";
  if (VUE === "entreprise") {
    var groupes = {};
    liste.forEach(function(c){
      var e = c.entreprise || "";
      if (!e) return;                                  /* v43: sans entreprise → pas de groupe, rendu dans le flux chrono */
      (groupes[e] = groupes[e] || []).push(c);
    });
    /* v43: on fusionne bandeaux d'entreprises et conversations sans entreprise,
       le tout trié par date du dernier message (descendant) */
    var items = Object.keys(groupes).map(function(e){
      return { type: "grp", e: e, at: dernierTs(groupes[e][0]) };
    });
    liste.forEach(function(c){ if (!c.entreprise) items.push({ type: "conv", c: c, at: dernierTs(c) }); });
    items.sort(function(a, b){ return b.at - a.at; });
    items.forEach(function(it){
      if (it.type === "conv") { dessinerConv(it.c, el); return; }
      var e = it.e;
      var g = groupes[e];
      var h = document.createElement("div");
      h.className = "grp" + (SELSENT===e ? " on" : "");
      var ouvert = GRP_OUVERTS[e] !== false;
      h.innerHTML = '<span class="tri" title="' + (ouvert ? "Masquer" : "Afficher") + ' les contacts de cette entreprise"> ' + (ouvert ? "▾" : "▸") + '</span> ' + "🏢 " + e +
        ' <span class="n">' + g.length + (g.length > 1 ? " contacts" : " contact") + '</span>' +
        '<span class="n" title="Heure du dernier message de l\'enseigne" style="margin-left:6px;opacity:.8;">🕓 ' + heureDernierMsg(g[0]) + '</span>' +
        '<span class="ind">' + (g.length > 1 ? "▶ clic : fil fusionné" : "") + '</span>';
      h.onclick = function(ev){
        if (ev && ev.target && ev.target.className === "tri") {
          GRP_OUVERTS[e] = !ouvert; renduListe(); return;
        }
        SELSENT = e; SELID = null; saverSel({ ent: e }); renduListe(); renduFil();
      };
      el.appendChild(h);
      if (ouvert) {
        var bloc = document.createElement("div");
        bloc.className = "grp-bloc";
        el.appendChild(bloc);
        g.forEach(function(x){ dessinerConv(x, bloc); });
      }
    });
  } else {
    liste.forEach(dessinerConv);
  }
  document.getElementById("nb").textContent = n + " conv.";
  if (n === 0) el.innerHTML = '<div class="vide-etat">' +
    '<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#b9c8da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.4 0-2.8-.3-4-.9L3 21l1.9-5.5c-.6-1.2-.9-2.6-.9-4a8.5 8.5 0 0 1 8.5-8.5 8.5 8.5 0 0 1 8.5 8.5z"/><path d="M8.5 11.5h7M8.5 8h4"/></svg>' +
    '<div class="ve-tit">Aucune conversation</div>' +
    '<div class="ve-txt">Aucune conversation ne correspond à ces filtres. Essaie d\'élargir les critères (canaux, cycles, assignation) dans le volet Filtres.</div></div>';
}

/* C8-DESIGN-2 : avatar initiales coloré (hash du nom → couleur stable) avec
   icône de canal en badge. Réutilise colDe() (palette équipe). */
function convAvatarHtml(nom, canal, gd) {
  var t = String(nom || "?").trim().split(/\s+/);
  var init = ((t[0] || "?").charAt(0) + (t[1] ? t[1].charAt(0) : "")).toUpperCase();
  var ico = (canal === "Email") ? "✉️" : "💬";

    '<span class="cch">' + ico + '</span></span>';
}
/* v41: extrait lisible — remplace « [modèle x] » par le corps du modèle */
function extraitAff(c) {
  var t = String(c.extrait || "");
  var mm = t.match(/^\[modèle ([^\]]+)\]/);
  if (mm) { var mo = MODELES_WA.filter(function(x){ return x.nom === mm[1]; })[0]; if (mo) t = "🗨 " + mo.txt; }
  return t;
}

    (VUE === "entreprise" ? '<div class="sousnom">'+c.contact.tel+'</div>' : '') +

    '<div class="meta"><span class="dot'+(c.lu?' lu':'')+'"></span>'+
    '<span class="tag" title="Date du dernier message">📅 '+(c.dateLbl || c.heure)+'</span>'+
    '<span class="tag" title="'+(c.assigne ? "Assignée à "+c.assigne : "Non assignée")+'" style="'+(c.assigne ? (c.assigne === MOI ? "background:#dcfce7;color:#166534;font-weight:700;" : "background:#eef1f5;color:#475569;") : "background:#fee2e2;color:#991b1b;")+'">'+(c.assigne ? avatar(c.assigne) + " " + c.assigne : "—")+'</span>'+
    '<span class="cy '+c.classe+'">'+c.cycle+'</span>'+
    /* C21-RECH : badges statut quand la conversation est rendue hors de son
       état habituel (visible uniquement via la recherche globale) */
    (c.archive ? '<span class="tag" title="Conversation archivée">📦 archivée</span>' : '')+
    (RATTACHE[c.id] ? '<span class="tag" title="Rattachée à une autre conversation">📎 rattachée</span>' : '')+
    '</div></div>';
  d.onclick = function(){ ouvrirConvLu(c.id); };
  d.oncontextmenu = function(ev){ menuContext(ev, c.id); };
  el.appendChild(d);
}

  }
  document.getElementById("filhead").innerHTML =

    (function(){ var sc = socParEnt(c.entreprise); return sc ? '<span class="risque '+sc.classeR+'" title="Statut de risque de la société">'+sc.risque+'</span>' : ''; })() +
    '<span class="tag" title="Sujet principal détecté automatiquement — ✏️ sur la fiche client pour corriger">📁 '+sujetDetecte(c)+'</span>'+
    (RATTACHE[c.id] ? '<span class="tag" title="Cette conversation est rattachée à une autre — ses messages apparaissent dans le fil principal">📎 rattachée à '+ (convParId(RATTACHE[c.id])||{nom:"?"}).nom +'</span>' : '')+
    (enfantsRattaches(c.id).length ? '<span class="tag">📎 '+enfantsRattaches(c.id).length+' conversation(s) rattachée(s)</span>' : '')+
    c.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join("") +
    '<span>📞 '+c.contact.tel+'</span>'+(c.contact.email ? '<span title="Adresse email du client — canal ✉️ actif">✉️ <a href="mailto:'+c.contact.email+'" style="color:inherit;">'+c.contact.email+'</a></span>' : '')+'<span>🛵 '+c.contact.plaque+'</span><span>⏱️ dernier message : '+c.delai+'</span><span>👤 '+(c.assigne ? "assignée à " + avatar(c.assigne) + ' <b>'+c.assigne+"</b>" : "<b>non assignée</b>")+'</span>'+(VRAIES_DONNEES ? vuTagConv(c) : '')+'</div>';

  var LIB = { client:"Client", agent:"Agent IA U'mob", collab:"Collègue" };
  var CLS = { client:"entrant", agent:"agent", collab:"collab" };
  var m = document.getElementById("messages"); m.innerHTML = "";
  var nbTrouves = 0;


  /* messages + commentaires internes fusionnés, par ordre chronologique */
  var items = [];
  c.fil.forEach(function(msg){ items.push({ type: "msg", key: cleMsg(c.id, msg), msg: msg }); });
  c.comms.forEach(function(k){ items.push({ type: "comm", key: cleComm(k.t), k: k }); });
  items.sort(function(a, b){ return a.key - b.key; });

  items.forEach(function(it){
    if (it.type === "msg") {
      var msg = it.msg;

      var b = document.createElement("div");
      var kc = msg.canal || c.canal;
      b.className = "bulle "+CLS[msg.qui]+(kc === "WhatsApp" ? " can-wa" : kc === "Email" ? " can-mail" : "");
      b.title = "Message " + kc;
      if (RECH_FIL && (String(msg.suj || "") + " " + msg.txt).toLowerCase().indexOf(RECH_FIL.toLowerCase()) < 0) b.classList.add("sans"); else nbTrouves++;

      b.innerHTML = '<div class="h"><span class="h-qui">'+auteurMsg(msg)+'</span> · '+msg.t+' '+(kc ? logoCanal(kc) : '')+cocheHtml(statutDe(msg, c.fil))+'</div>'+objetHtml(msg, RECH_FIL)+corpsMsgHtml(msg, RECH_FIL)+photoHtml(msg)+expediteurHtml(msg) +
        (msg.pj ? (msg.img
            ? '<div class="mini" style="'+(msg.url ? 'background-image:url(' + msg.url + ');background-size:cover;' : '')+'">'+(msg.url ? "" : "🖼 " + msg.pj)+'</div>'
            : '<div class="pj">📎 <b>' + msg.pj + '</b> · ' + msg.taille + '</div>')

          : (msg.img ? '<div class="mini">📷 photo du pneu</div>' : ''));
      m.appendChild(b);
    } else {
      var d = document.createElement("div");
      d.className = "bulle-note";
      if (RECH_FIL && it.k.txt.toLowerCase().indexOf(RECH_FIL.toLowerCase()) < 0) d.classList.add("sans"); else nbTrouves++;
      var mentions = personnesTaguees(it.k.txt);
      /* C17-VU : personnes taguées ayant ouvert la conversation APRÈS ce
         commentaire → « 👁️ vu par » (l'auteur et moi exclus) */
      var vuIx = (ACT_BAS[cleConv(c)] || {}).vu || {};
      var vus = mentions.filter(function(p) {
        return p !== it.k.a && p !== MOI && vuPlusRecentQue(vuIx[p], it.k.t);
      });
      /* C15-ACT-2 : boutons éditer/supprimer sur les commentaires AVEC uid
         (les vieux commentaires d'avant la v73 n'en ont pas → pas de boutons) */
      var btnsC = it.k.uid
        ? ' <span style="float:right;font-size:10.5px;white-space:nowrap;">' +
          '<a href="javascript:void(0)" onclick="editerComm(\'' + it.k.uid + '\')" title="Modifier ce commentaire" style="margin-right:6px;">✏</a>' +
          '<a href="javascript:void(0)" onclick="supprimerComm(\'' + it.k.uid + '\')" title="Supprimer ce commentaire">🗑️</a></span>' : '';
      d.innerHTML = '<div class="h">📌 ' + avatar(it.k.a) + ' Commentaire interne — ' + it.k.a + ' · ' + it.k.t + (it.k.mod ? ' · <i style="opacity:.7;">modifié</i>' : '') + btnsC + '</div>' +
        surligner(it.k.txt, RECH_FIL) +
        (mentions.length ? ' <span class="tag" style="background:#fef3c7;color:#92400e;">👤 ' + mentions.join(", ") + ' tagué(s)</span>' : '') +
        (vus.length ? ' <span class="tag" style="background:#e6f7ef;color:#1d7a4f;">👁️ vu par ' + vus.join(", ") + '</span>' : '');
      m.appendChild(d);
    }
  });
  /* conversations rattachées : leurs messages s'ajoutent au fil principal */
  enfantsRattaches(c.id).forEach(function(e){
    var sep = document.createElement("div");
    sep.style.cssText = "align-self:center;font-size:10.5px;color:#9aa4b1;background:#eef1f5;border-radius:999px;padding:3px 10px;";
    sep.textContent = "📎 conversation rattachée : " + e.nom + " · " + sujetDetecte(e);
    m.appendChild(sep);
    e.fil.forEach(function(msg){
      var b = document.createElement("div");
      var kc = msg.canal || e.canal;
      b.className = "bulle " + CLS[msg.qui] + (kc === "WhatsApp" ? " can-wa" : kc === "Email" ? " can-mail" : "");
      b.title = "Message " + kc;
      if (RECH_FIL && (String(msg.suj || "") + " " + msg.txt).toLowerCase().indexOf(RECH_FIL.toLowerCase()) < 0) b.classList.add("sans"); else nbTrouves++;
      var qui = auteurMsg(msg) + (msg.qui === "client" ? " · " + e.nom : "");
      b.innerHTML = '<div class="h"><span class="h-qui">' + qui + '</span> · ' + msg.t + ' ' + (kc ? logoCanal(kc) : '') + cocheHtml(statutDe(msg, e.fil)) + '</div>' + objetHtml(msg, RECH_FIL) + corpsMsgHtml(msg, RECH_FIL) + photoHtml(msg) + expediteurHtml(msg) +
        (msg.img ? '<div class="mini">📷 photo</div>' : '');
      m.appendChild(b);
    });
  });

  document.getElementById("rech-fil-nb").textContent = RECH_FIL ? (nbTrouves + " message" + (nbTrouves > 1 ? "s" : "") + " sur " + c.fil.length) : "";
  if (!RECH_FIL) m.scrollTop = m.scrollHeight;
  m.onscroll = majDescente;
  majDescente();

  var cz = document.getElementById("commzone");
  cz.innerHTML =
    '<div class="comm-saisie">' +
      '<button class="btn" onclick="dicterComm()" title="Dicter le commentaire au micro">🎤</button>' +
      '<button class="btn" onclick="ouvrirVoletMentions()" title="Mentionner un collègue (@) — il recevra une notification">👥</button>' +
      '<div class="comm-champ">' +
        '<input id="nv-comm" placeholder="Ajouter un commentaire interne (visible par l\'équipe uniquement)… Tape @ pour mentionner" oninput="suggMentions()" onkeydown="return commKey(event)" onblur="setTimeout(fermerSugg,150)"/>' +
        '<div id="mentions-sugg" style="display:none"></div>' +
      '</div>' +
      '<div id="volet-mentions" style="display:none"></div>' +
      '<button class="btn primaire" onclick="ajouterComm()" title="Publier le commentaire interne (signé : '+MOI+')">Commenter</button>' +
    '</div>';

  rafraichirFiche();
}

/* ---- Fil fusionné par entreprise ---- */
function triMsg(a, b) { return a.key - b.key; }

function renduFilEntreprise(e) {
  var convs = CONVS.filter(function(c){ return c.entreprise === e; });
  var LIB = { client:"Client", agent:"Agent IA U'mob", collab:"Collègue" };
  var CLS = { client:"entrant", agent:"agent", collab:"collab" };
  var JLIB = { 0:"aujourd'hui", 1:"hier", 2:"lundi" };

  var socE = socParEnt(e);
  document.getElementById("filhead").innerHTML =
    '<div class="l1"><span class="cav gd" style="background:linear-gradient(135deg,#1273d1,#0a3f77);">🏢</span><b>' + e + '</b>' +

      return '<span>' + (c.canal==="WhatsApp"?"💬":"✉️") + ' ' + c.nom + ' · ' + c.contact.tel + ' · <span class="cy ' + c.classe + '">' + c.cycle + '</span></span>';
    }).join("") + '</div>';

  var msgs = [];
  convs.forEach(function(c){
    var jour = (JOUR[c.id] !== undefined) ? JOUR[c.id] : 0;
    c.fil.forEach(function(msg){
      /* C7-TRI-1 : tri sur le timestamp réel (msg.ts) — le libellé "jj/mm
         hh:mm" n'est pas trié par parseInt (30/10 → 30, 02/11 → 2). */
      msgs.push({ key: cleMsg(c.id, msg), jour: jour, msg: msg, conv: c });
    });

  msgs.sort(triMsg);

  var m = document.getElementById("messages"); m.innerHTML = "";

      sep.textContent = "— " + JLIB[it.jour] + " —";
      m.appendChild(sep);
    }
    var b = document.createElement("div");
    var kc = it.msg.canal || it.conv.canal;
    b.className = "bulle " + CLS[it.msg.qui] + (kc === "WhatsApp" ? " can-wa" : kc === "Email" ? " can-mail" : "");
    b.title = "Message " + kc;
    if (RECH_FIL && (String(it.msg.suj || "") + " " + it.msg.txt).toLowerCase().indexOf(RECH_FIL.toLowerCase()) < 0) b.classList.add("sans"); else nbTrouves++;
    var qui = auteurMsg(it.msg) + (it.msg.qui === "client" ? " · " + it.conv.nom : "");
    b.innerHTML = '<div class="h"><span class="h-qui">' + qui + '</span> · ' + it.msg.t + ' ' + (kc ? logoCanal(kc) : '') + cocheHtml(statutDe(it.msg, it.conv.fil)) + '</div>' + objetHtml(it.msg, RECH_FIL) + corpsMsgHtml(it.msg, RECH_FIL) + expediteurHtml(it.msg) +
      (it.msg.pj ? (it.msg.img
          ? '<div class="mini" style="'+(it.msg.url ? 'background-image:url(' + it.msg.url + ');background-size:cover;' : '')+'">'+(it.msg.url ? "" : "🖼 " + it.msg.pj)+'</div>'
          : '<div class="pj">📎 <b>' + it.msg.pj + '</b> · ' + it.msg.taille + '</div>')
        : (it.msg.img ? '<div class="mini">📷 photo du pneu</div>' : ''));
    m.appendChild(b);
  });
  document.getElementById("rech-fil-nb").textContent = RECH_FIL ? (nbTrouves + " message" + (nbTrouves > 1 ? "s" : "") + " sur " + msgs.length) : "";

  var comms = [];
  convs.forEach(function(c){ c.comms.forEach(function(k){ comms.push({a:k.a, t:k.t, txt:k.txt, who:c.nom}); }); });
  var cz = document.getElementById("commzone");
  cz.innerHTML = "<h4>💬 Commentaires internes (équipe — tous contacts de l'entreprise)</h4>" +
    (comms.length ? comms.map(function(k){
      return '<div class="comm">' + avatar(k.a) + ' <b>' + k.a + '</b> (' + k.t + ', ' + k.who + ') : ' + k.txt + '</div>';
    }).join("") : '<div class="comm" style="color:#a3a08f">Aucun commentaire interne.</div>') +
    '<div class="comm" style="color:#a3a08f;font-size:11px;">✏ Pour écrire un commentaire interne ou assigner, ouvre une conversation précise (clic sur un contact dans la liste).</div>';

  rafraichirFiche();
}

/* v119: le canal d'envoi suit la conversation ouverte — sinon CANAL_ENVOI
   reste bloqué sur le dernier canal utilisé et l'avertissement 24 h
   (WhatsApp uniquement) ne s'affiche jamais. Appelé à l'ouverture (voirConv)
   ET à la restauration de sélection au chargement. */
function syncCanalConv(c) { if (c) setCanalEnvoi(c.canal === "Email" ? "Email" : "WhatsApp"); }
function voirConv(id) {
  marquerLecture(convParId(id));
  marquerVu(convParId(id));               /* C17-VU : accusé de vue persisté */
  SELID = id; SELSENT = null; saverSel({ id: id, key: (convParId(id) && (convParId(id).contact.tel || convParId(id).contact.email)) || "" });
  resetPJsBrouillon();   /* v127 : les PJ du brouillon appartiennent à la conversation en cours */
  syncCanalConv(convParId(id));
  renduListe(); renduFil(); majSaisieC2();   /* v44: rafraîchit l'avertissement fenêtre 24 h */
  if (estMobile()) basculerVueMobile("volet-fil");   /* C14-MOBILE : ouvrir une conversation = vue fil plein écran */
}
/* v116 : sélection persistée — au rechargement, on retrouve la conversation
   (ou le groupe entreprise) ouvert avant le F5. */
function saverSel(o) { try { localStorage.setItem("umob_sel", JSON.stringify(o)); } catch (e) {} }
function restaurerSelection() {
  var o = null;
  try { o = JSON.parse(localStorage.getItem("umob_sel") || "null"); } catch (e) {}
  if (!o) return;
  if (o.ent) { SELSENT = o.ent; SELID = null; resetPJsBrouillon(); renduListe(); renduFil(); majSaisieC2(); return; }
  if (o.id && convParId(o.id)) { SELID = o.id; SELSENT = null; resetPJsBrouillon(); syncCanalConv(convParId(o.id)); renduListe(); renduFil(); majSaisieC2(); return; }
  if (o.key) {
    var c = CONVS.filter(function(x){ return (x.contact.tel || x.contact.email || "") === o.key; })[0];
    if (c) { SELID = c.id; SELSENT = null; resetPJsBrouillon(); syncCanalConv(c); renduListe(); renduFil(); majSaisieC2(); }
  }
}
/* ===== C14-MOBILE : navigation un volet à la fois (≤ 860 px) ============
   estMobile() : vrai sur petit écran ; basculerVueMobile affiche UN volet
   (les autres sont masqués par le CSS responsive) ; majMobile neutralise
   les états desktop (volets pliés, largeurs) et remet la vue en cours. */
var VUE_MOBILE = "volet-liste";
function estMobile() { return !!(window.matchMedia && window.matchMedia("(max-width: 860px)").matches); }
function basculerVueMobile(v) {
  if (!estMobile()) return;
  VUE_MOBILE = v;
  ["volet-filtres", "volet-liste", "volet-fil"].forEach(function(id) {
    var e = document.getElementById(id);
    if (e) e.classList.toggle("vue-mobile", id === v);
  });
  if (v === "volet-fil") { setTimeout(descenteFil, 80); }  /* le fil reprend sa place en bas */
}
function majMobile() {
  ["volet-filtres", "volet-liste", "volet-fil"].forEach(function(id) {
    var e = document.getElementById(id);
    if (!e) return;
    if (estMobile()) {
      e.classList.remove("replie");            /* pas d'état « plié » en mobile */
      e.classList.toggle("vue-mobile", id === VUE_MOBILE);
    } else {
